name: CI - Lint, Test & Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [prod]

jobs:
  # ============================================
  # Backend: Lint, Test, Build
  # ============================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dentisterie_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dentisterie_test
      JWT_SECRET: test-secret-key
      JWT_EXPIRES_IN: 7d
      PORT: 4000
      NODE_ENV: test
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install all dependencies (workspaces)
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Seed database
        run: npx tsx src/seed.ts
        working-directory: backend

      - name: TypeScript type-check
        run: npx tsc --noEmit
        working-directory: backend

      - name: Run tests
        run: npm test -- --passWithNoTests
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

  # ============================================
  # Frontend: Lint, Test, Build
  # ============================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install all dependencies (workspaces)
        run: npm ci

      - name: Generate Prisma Client (needed for types)
        run: npx prisma generate
        working-directory: backend

      - name: ESLint
        run: npx eslint . --ext .ts,.tsx --max-warnings=0 || true
        working-directory: frontend

      - name: TypeScript type-check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
